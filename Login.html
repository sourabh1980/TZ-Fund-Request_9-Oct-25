<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --input-bg: rgba(255, 255, 255, 0.05);
            --primary-color: #a855f7;
            /* Purple */
            --secondary-color: #3b82f6;
            /* Blue */
            --text-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
            color: var(--text-color);
        }

        /* Dynamic Northern Lights Effect */
        body::before,
        body::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200vw;
            height: 200vh;
            transform: translate(-50%, -50%);
            background:
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.5), transparent 50%),
                /* Blue */
                radial-gradient(circle at 20% 20%, rgba(239, 68, 68, 0.4), transparent 40%),
                /* Red */
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.4), transparent 40%),
                /* Green */
                radial-gradient(circle at 80% 20%, rgba(139, 92, 246, 0.5), transparent 40%),
                /* Violet */
                radial-gradient(circle at 20% 80%, rgba(6, 182, 212, 0.4), transparent 40%);
            /* Cyan */
            background-size: 200% 200%;
            animation: aurora 15s ease infinite alternate;
            z-index: -1;
            filter: blur(60px);
        }

        body::after {
            background:
                radial-gradient(circle at 40% 60%, rgba(124, 58, 237, 0.4), transparent 40%),
                /* Violet */
                radial-gradient(circle at 60% 40%, rgba(59, 130, 246, 0.4), transparent 40%),
                /* Blue */
                radial-gradient(circle at 30% 30%, rgba(16, 185, 129, 0.3), transparent 40%);
            /* Green */
            animation: aurora-shift 20s linear infinite reverse;
            mix-blend-mode: screen;
        }

        @keyframes aurora {
            0% {
                background-position: 0% 50%;
                transform: translate(-50%, -50%) scale(1);
            }

            50% {
                background-position: 100% 50%;
                transform: translate(-50%, -50%) scale(1.1);
            }

            100% {
                background-position: 0% 50%;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        @keyframes aurora-shift {
            0% {
                transform: translate(-50%, -50%) rotate(0deg) scale(1.2);
            }

            100% {
                transform: translate(-50%, -50%) rotate(360deg) scale(1.2);
            }
        }

        @keyframes drift {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 360px;
            box-shadow: var(--glass-shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        h1 {
            margin-bottom: 30px;
            font-weight: 600;
            letter-spacing: 1px;
            background: linear-gradient(to right, #c084fc, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 2rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        input:focus {
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* Custom Checkbox "I'm not a robot" */
        .robot-check {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            transition: background 0.3s;
        }

        .robot-check:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .robot-box {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
        }

        .robot-check.checked .robot-box {
            background: #10b981;
            /* Green */
            border-color: #10b981;
        }

        .robot-box::after {
            content: '✓';
            color: white;
            font-size: 14px;
            display: none;
        }

        .robot-check.checked .robot-box::after {
            display: block;
        }

        .robot-text {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.8);
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Outfit', sans-serif;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
            margin-top: 15px;
            min-height: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .shake {
            animation: shake 0.5s cubic-bezier(.36, .07, .19, .97) both;
        }

        @keyframes shake {

            10%,
            90% {
                transform: translate3d(-1px, 0, 0);
            }

            20%,
            80% {
                transform: translate3d(2px, 0, 0);
            }

            30%,
            50%,
            70% {
                transform: translate3d(-4px, 0, 0);
            }

            40%,
            60% {
                transform: translate3d(4px, 0, 0);
            }
        }

        /* Loading Spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="login-card" id="loginCard">
        <h1>Welcome</h1>

        <div class="input-group">
            <input type="text" id="username" placeholder="Username" autocomplete="off">
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="Password">
        </div>

        <div class="input-group">
            <input type="password" id="secretCode" placeholder="Secret Code">
        </div>

        <div class="robot-check" onclick="toggleRobot()" id="robotCheck">
            <div class="robot-box"></div>
            <span class="robot-text">I'm not a robot</span>
        </div>

        <button onclick="attemptLogin()" id="loginBtn">
            <span id="btnText">Login</span>
            <div class="spinner" id="btnSpinner"></div>
        </button>

        <div class="error-msg" id="errorMsg">Invalid credentials</div>
    </div>

    <script>
        var SCRIPT_URL = <?= scriptUrl ?>;
        let isRobotChecked = false;

        function toggleRobot() {
            const el = document.getElementById('robotCheck');
            isRobotChecked = !isRobotChecked;
            if (isRobotChecked) {
                el.classList.add('checked');
            } else {
                el.classList.remove('checked');
            }
        }

        function attemptLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const code = document.getElementById('secretCode').value;
            const errorEl = document.getElementById('errorMsg');
            const card = document.getElementById('loginCard');
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            errorEl.style.opacity = '0';

            if (!user || !pass || !code) {
                showError('Please fill in all fields');
                return;
            }

            if (!isRobotChecked) {
                showError('Please verify you are not a robot');
                return;
            }

            // Loading State
            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'inline-block';

            google.script.run
                .withSuccessHandler(res => {
                    if (res.success) {
                        // Success Animation
                        card.innerHTML = `
              <h1 style="margin:0;">Success!</h1>
              <p style="color:rgba(255,255,255,0.8);">Welcome back, ${res.user.name}</p>
              <div style="font-size:3rem; margin-top:20px;">🚀</div>
              <p style="margin-top:20px; font-size:0.9rem;">Redirecting...</p>
              <a href="${SCRIPT_URL}?page=main" target="_top" style="color:#fff; text-decoration:underline; font-size:0.8rem;">Click here if not redirected</a>
            `;

                        // Redirect to main app
                        setTimeout(() => {
                            window.top.location.href = SCRIPT_URL + '?page=main';
                        }, 1000);

                    } else {
                        resetBtn();
                        showError(res.message);
                    }
                })
                .withFailureHandler(err => {
                    resetBtn();
                    showError('Connection failed. Try again.');
                    console.error(err);
                })
                .verifyLogin({
                    username: user,
                    password: pass,
                    secretCode: code
                });
        }

        function showError(msg) {
            const errorEl = document.getElementById('errorMsg');
            const card = document.getElementById('loginCard');
            errorEl.textContent = msg;
            errorEl.style.opacity = '1';

            // Shake animation
            card.classList.remove('shake');
            void card.offsetWidth; // trigger reflow
            card.classList.add('shake');
        }

        function resetBtn() {
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('btnSpinner');

            btn.disabled = false;
            btnText.style.display = 'inline';
            spinner.style.display = 'none';
        }
    </script>

</body>

</html>
