<div id="inUseVehicleModal" class="in-use-modal">
    <div class="in-use-modal-content">
        <div class="in-use-header">
            <h2 class="in-use-title">In Use Vehicle Catalog</h2>
            <button class="in-use-close" onclick="closeInUseVehicleCatalog()">&times;</button>
        </div>

        <div class="in-use-controls">
            <div class="in-use-search-bar">
                <input type="text" id="inUseSearchInput" placeholder="Search vehicles..."
                    onkeyup="filterInUseVehicles()">
                <button class="in-use-search-btn" onclick="filterInUseVehicles()">
                    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
                <button class="clear-filters-link" onclick="clearInUseFilters()">Clear All</button>
            </div>

            <div class="in-use-filters">
                <button class="filter-chip" onclick="toggleInUseFilter('topRated', this)">Top Rated (4-5★)</button>
                <button class="filter-chip" onclick="toggleInUseFilter('lowRated', this)">Low Rated (1-3★)</button>

                <div class="dropdown-filter">
                    <button class="filter-chip dropdown-trigger" onclick="toggleDropdown('makeDropdown')">Make ▾</button>
                    <div id="makeDropdown" class="dropdown-content"></div>
                </div>

                <div class="dropdown-filter">
                    <button class="filter-chip dropdown-trigger" onclick="toggleDropdown('modelDropdown')">Model ▾</button>
                    <div id="modelDropdown" class="dropdown-content"></div>
                </div>

                <div class="dropdown-filter">
                    <button class="filter-chip dropdown-trigger" onclick="toggleDropdown('categoryDropdown')">Category ▾</button>
                    <div id="categoryDropdown" class="dropdown-content"></div>
                </div>

                <div class="dropdown-filter">
                    <button class="filter-chip dropdown-trigger" onclick="toggleDropdown('usageDropdown')">Usage ▾</button>
                    <div id="usageDropdown" class="dropdown-content"></div>
                </div>

                <div class="dropdown-filter">
                    <button class="filter-chip dropdown-trigger" onclick="toggleDropdown('typeDropdown')">Type ▾</button>
                    <div id="typeDropdown" class="dropdown-content"></div>
                </div>

                <div class="dropdown-filter">
                    <button class="filter-chip dropdown-trigger" onclick="toggleDropdown('projectDropdown')">Project ▾</button>
                    <div id="projectDropdown" class="dropdown-content"></div>
                </div>

                <div class="dropdown-filter">
                    <button class="filter-chip dropdown-trigger" onclick="toggleDropdown('teamDropdown')">Team ▾</button>
                    <div id="teamDropdown" class="dropdown-content"></div>
                </div>

                <div class="dropdown-filter">
                    <button class="filter-chip dropdown-trigger" onclick="toggleDropdown('ownerDropdown')">Owner ▾</button>
                    <div id="ownerDropdown" class="dropdown-content"></div>
                </div>
            </div>

        </div>

        <div id="inUseVehicleGrid" class="in-use-grid">
            <!-- Vehicle table will be injected here -->
            <div class="loading-spinner">Loading vehicles...</div>
        </div>
    </div>
</div>

<script>
    let allInUseVehicles = [];
    let activeFilters = {
        topRated: false,
        lowRated: false,
        make: null,
        model: null,
        category: null,
        usage: null,
        type: null,
        project: null,
        team: null,
        owner: null
    };
    let teamColorMap = {};
    const IN_USE_REFRESH_INTERVAL = 20000; // ms
    let inUseRefreshTimer = null;
    let metaReady = false;

    function pickFirstFilled() {
        for (let i = 0; i < arguments.length; i++) {
            const val = arguments[i];
            if (val == null) continue;
            const str = typeof val === 'string' ? val.trim() : String(val);
            if (str) return str;
        }
        return '';
    }

    function findVehicleMeta(vehicleNumber) {
        const key = (vehicleNumber || '').toString().trim().toLowerCase();
        if (!key) return null;

        const metaMap = (typeof window !== 'undefined' && window.carTPVehicleMeta)
            ? window.carTPVehicleMeta
            : null;

        // Object map lookup (keys may be mixed-case)
        if (metaMap && !Array.isArray(metaMap) && typeof metaMap === 'object') {
            if (metaMap[vehicleNumber]) return metaMap[vehicleNumber];
            if (metaMap[key]) return metaMap[key];
            if (metaMap[key.toUpperCase()]) return metaMap[key.toUpperCase()];
            for (const metaKey in metaMap) {
                if (!metaKey) continue;
                if (metaKey.toString().trim().toLowerCase() === key) {
                    return metaMap[metaKey];
                }
            }
        }

        const asArray = Array.isArray(metaMap) ? metaMap
            : (metaMap && Array.isArray(metaMap.vehicles) ? metaMap.vehicles : null);

        if (asArray) {
            const match = asArray.find(car => {
                const cNum = (car.carNumber || car.vehicleNumber || car.car || car.vehicle || '').toString().trim().toLowerCase();
                return cNum === key;
            });
            if (match && typeof window.normalizeVehiclePickerRow === 'function') {
                return window.normalizeVehiclePickerRow(match) || match;
            }
            if (match) return match;
        }

        // Local cached picker data
        if (Array.isArray(window.availableCarsData)) {
            const match = window.availableCarsData.find(car => {
                const cNum = (car.carNumber || car.vehicleNumber || '').toString().trim().toLowerCase();
                return cNum === key;
            });
            if (match) return match;
        }
        return null;
    }

    function normalizeInUseVehicle(entry) {
        const e = entry || {};
        const vehicleNumber = pickFirstFilled(e.vehicleNumber, e.carNumber, e.car, e.Vehicle, e['Vehicle No'], e['Car No']);
        const meta = findVehicleMeta(vehicleNumber) || {};

        return {
            ...e,
            vehicleNumber,
            make: pickFirstFilled(e.make, e.Make, e.vehicleMake, e['Vehicle Make'], e['Car Make'], e.brand, e.Brand, meta.make, meta.Make, meta.Brand, meta.brand),
            model: pickFirstFilled(e.model, e.Model, e.vehicleModel, e['Vehicle Model'], e['Car Model'], meta.model, meta.Model),
            category: pickFirstFilled(e.category, e.Category, e.type, e.Type, e['Vehicle Category'], e['Vehicle Type'], e.cat, meta.category, meta.Category, meta.type, meta.Type, meta['Vehicle Category']),
            usageType: pickFirstFilled(e.usageType, e.usage, e['Usage Type'], e['Usage'], e.usage_type, meta.usageType, meta['Usage Type'], meta.usage),
            owner: pickFirstFilled(e.owner, e.Owner, e['Owner Name'], e['Vehicle Owner'], meta.owner, meta.Owner),
            project: pickFirstFilled(e.project, e.Project, meta.project, meta.Project),
            team: pickFirstFilled(e.team, e.Team, meta.team, meta.Team)
        };
    }

    function normalizeVehicleList(list) {
        return Array.isArray(list) ? list.map(normalizeInUseVehicle) : [];
    }

    function ensureMetaThen(fn) {
        if (metaReady) {
            fn();
            return;
        }
        const fallback = () => { metaReady = true; fn(); };
        if (typeof window.ensureVehicleMetaCache === 'function') {
            window.ensureVehicleMetaCache(() => {
                metaReady = true;
                fn();
            });
        } else if (window.FRTZ && typeof window.FRTZ.ensureVehicleInventoryWarm === 'function') {
            window.FRTZ.ensureVehicleInventoryWarm().finally(() => {
                metaReady = true;
                fn();
            });
        } else {
            fallback();
        }
    }

    function openInUseVehicleCatalog() {
        const modal = document.getElementById('inUseVehicleModal');
        modal.classList.add('show');
        ensureMetaThen(fetchInUseVehicles);
        startInUseAutoRefresh();
    }

    function closeInUseVehicleCatalog() {
        const modal = document.getElementById('inUseVehicleModal');
        modal.classList.remove('show');
        stopInUseAutoRefresh();
    }

    function startInUseAutoRefresh() {
        stopInUseAutoRefresh();
        inUseRefreshTimer = setInterval(() => {
            try { fetchInUseVehicles({ silent: true }); } catch (_err) { /* ignore */ }
        }, IN_USE_REFRESH_INTERVAL);
    }

    function stopInUseAutoRefresh() {
        if (inUseRefreshTimer) {
            clearInterval(inUseRefreshTimer);
            inUseRefreshTimer = null;
        }
    }

    function fetchInUseVehicles(options = {}) {
        const { silent = false } = options;
        const grid = document.getElementById('inUseVehicleGrid');
        if (!silent) {
            grid.innerHTML = '<div class="loading-spinner">Loading vehicles...</div>';
        }

        const canCallServer = (typeof google !== 'undefined') &&
            google.script &&
            google.script.run;

        if (!canCallServer) {
            console.error('Google Script Run API not available');
            if (!renderInUseFromCache('Google Script API unavailable')) {
                grid.innerHTML = '<div class="loading-spinner">Error: Google Script API unavailable</div>';
            }
            return;
        }

        google.script.run
            .withSuccessHandler(data => {
                try {
                    if (data && data.ok) {
                        if (!Array.isArray(data.assignments)) {
                            console.error('Data assignments is not an array:', data.assignments);
                            grid.innerHTML = '<div class="loading-spinner">Error: Invalid data format received</div>';
                            return;
                        }
                        allInUseVehicles = normalizeVehicleList(data.assignments);
                        try { window.vehicleInUseRecords = allInUseVehicles.slice(); } catch (_cacheErr) {}
                        buildTeamColorMap();
                        populateDropdowns(allInUseVehicles);
                        renderInUseVehicles(allInUseVehicles);
                    } else {
                        const errorText = (data && (data.error || data.message))
                            ? (data.error || data.message)
                            : 'Unknown error';
                        console.error('Server returned error:', data || 'No data');
                        if (!renderInUseFromCache(errorText)) {
                            grid.innerHTML = '<div class="loading-spinner">Error loading vehicles: ' + errorText + '</div>';
                        }
                    }
                } catch (e) {
                    console.error('Error in success handler:', e);
                    grid.innerHTML = '<div class="loading-spinner">Error processing data: ' + e.message + '</div>';
                }
            })
            .withFailureHandler(err => {
                const errMsg = err && err.message ? err.message : String(err || 'Unknown error');
                console.error('Failed to fetch vehicles:', errMsg);
                if (!renderInUseFromCache(errMsg)) {
                    if (!silent) {
                        grid.innerHTML = '<div class="loading-spinner">Failed to fetch data: ' + errMsg + '</div>';
                    }
                }
            })
            .getVehicleInUseSummaryFromCarTP();
    }

    function renderInUseFromCache(reason) {
        try {
            const cached = Array.isArray(window.vehicleInUseRecords) ? window.vehicleInUseRecords : [];
            if (cached.length) {
                allInUseVehicles = normalizeVehicleList(cached.slice());
                buildTeamColorMap();
                populateDropdowns(allInUseVehicles);
                renderInUseVehicles(allInUseVehicles);
                console.warn('Loaded in-use vehicles from local cache', { reason, count: allInUseVehicles.length });
                return true;
            }
        } catch (cacheErr) {
            console.warn('Local cache fallback failed:', cacheErr);
        }
        return false;
    }

    function buildTeamColorMap() {
        teamColorMap = {};
        const palette = [
            '#fff7ed', // warm light orange
            '#fef3c7', // light yellow
            '#e0f2fe', // light blue
            '#ecfdf3', // light green
            '#f5f3ff', // light purple
            '#fdf2ff', // light pink
            '#e5f6ff', // icy blue
            '#f9fafb'  // light grey
        ];
        let index = 0;

        allInUseVehicles.forEach(v => {
            const t = v.team || 'Unassigned';
            if (!teamColorMap[t]) {
                teamColorMap[t] = palette[index % palette.length];
                index++;
            }
        });
    }

    function populateDropdowns(vehicles) {
        const sets = {
            make: new Set(),
            model: new Set(),
            category: new Set(),
            usageType: new Set(),
            project: new Set(),
            team: new Set(),
            owner: new Set()
        };

        vehicles.forEach(v => {
            if (v.make) sets.make.add(v.make);
            if (v.model) sets.model.add(v.model);
            if (v.category) sets.category.add(v.category);
            if (v.usageType) sets.usageType.add(v.usageType);
            if (v.project) sets.project.add(v.project);
            if (v.team) sets.team.add(v.team);
            if (v.owner) sets.owner.add(v.owner);
        });

        fillDropdown('makeDropdown', sets.make, 'make');
        fillDropdown('modelDropdown', sets.model, 'model');
        fillDropdown('categoryDropdown', sets.category, 'category');
        fillDropdown('usageDropdown', sets.usageType, 'usage');
        fillDropdown('typeDropdown', sets.category, 'type'); // type mapped to category
        fillDropdown('projectDropdown', sets.project, 'project');
        fillDropdown('teamDropdown', sets.team, 'team');
        fillDropdown('ownerDropdown', sets.owner, 'owner');
    }

    function fillDropdown(id, set, filterKey) {
        const el = document.getElementById(id);
        el.innerHTML = '';
        Array.from(set).sort().forEach(val => {
            const div = document.createElement('div');
            div.className = 'dropdown-item';
            div.textContent = val;
            div.onclick = () => selectDropdownItem(filterKey, val, div);
            el.appendChild(div);
        });
    }

    function toggleDropdown(id) {
        const el = document.getElementById(id);
        const wasShown = el.classList.contains('show');
        document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
        if (!wasShown) el.classList.add('show');
    }

    window.addEventListener('click', function (e) {
        if (!e.target.closest('.dropdown-filter')) {
            document.querySelectorAll('.dropdown-content').forEach(d => d.classList.remove('show'));
        }
    });

    function toggleInUseFilter(type, btn) {
        if (type === 'topRated') {
            activeFilters.topRated = !activeFilters.topRated;
            if (activeFilters.topRated) activeFilters.lowRated = false;
        } else if (type === 'lowRated') {
            activeFilters.lowRated = !activeFilters.lowRated;
            if (activeFilters.lowRated) activeFilters.topRated = false;
        }

        document.querySelectorAll('.filter-chip').forEach(c => {
            if (c.textContent.includes('Top Rated')) c.classList.toggle('active', activeFilters.topRated);
            if (c.textContent.includes('Low Rated')) c.classList.toggle('active', activeFilters.lowRated);
        });

        filterInUseVehicles();
    }

    function selectDropdownItem(key, val, el) {
        activeFilters[key] = activeFilters[key] === val ? null : val;

        const parent = el.parentElement;
        Array.from(parent.children).forEach(c => c.classList.remove('selected'));
        if (activeFilters[key]) el.classList.add('selected');

        const trigger = parent.previousElementSibling;
        const label = key.charAt(0).toUpperCase() + key.slice(1);
        trigger.textContent = activeFilters[key] ? label + ': ' + val : label + ' ▾';
        trigger.classList.toggle('active', !!activeFilters[key]);

        filterInUseVehicles();
    }

    function clearInUseFilters() {
        activeFilters = {
        topRated: false,
        lowRated: false,
        make: null,
        model: null,
        category: null,
        usage: null,
        type: null,
        project: null,
        team: null,
        owner: null
    };

        document.getElementById('inUseSearchInput').value = '';
        document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.dropdown-item').forEach(c => c.classList.remove('selected'));
        document.querySelectorAll('.dropdown-trigger').forEach(t => {
            if (t.textContent.startsWith('Make')) t.textContent = 'Make ▾';
            if (t.textContent.startsWith('Model')) t.textContent = 'Model ▾';
            if (t.textContent.startsWith('Category')) t.textContent = 'Category ▾';
            if (t.textContent.startsWith('Usage')) t.textContent = 'Usage ▾';
            if (t.textContent.startsWith('Type')) t.textContent = 'Type ▾';
            if (t.textContent.startsWith('Project')) t.textContent = 'Project ▾';
            if (t.textContent.startsWith('Team')) t.textContent = 'Team ▾';
            if (t.textContent.startsWith('Owner')) t.textContent = 'Owner ▾';
        });

        filterInUseVehicles();
    }

    function computeInUseDays(entry) {
        try {
            const raw = entry && (entry.rBenTime || entry.latestTimestamp);
            if (!raw) return null;
            const ts = new Date(raw).getTime();
            if (!ts || Number.isNaN(ts)) return null;
            const diff = Date.now() - ts;
            if (diff < 0) return 0;
            return Math.max(1, Math.floor(diff / 86400000) + 1);
        } catch (_err) {
            return null;
        }
    }

    function filterInUseVehicles() {
        const search = document.getElementById('inUseSearchInput').value.toLowerCase();

        const filtered = allInUseVehicles.filter(v => {
            const matchSearch = !search ||
                (v.vehicleNumber && v.vehicleNumber.toLowerCase().includes(search)) ||
                (v.make && v.make.toLowerCase().includes(search)) ||
                (v.model && v.model.toLowerCase().includes(search)) ||
                (v.beneficiary && v.beneficiary.toLowerCase().includes(search));

            if (!matchSearch) return false;

            if (activeFilters.topRated && (v.stars < 4)) return false;
            if (activeFilters.lowRated && (v.stars > 3 || v.stars < 1)) return false;

            if (activeFilters.make && v.make !== activeFilters.make) return false;
            if (activeFilters.model && v.model !== activeFilters.model) return false;
            if (activeFilters.category && v.category !== activeFilters.category) return false;
            if (activeFilters.usage && v.usageType !== activeFilters.usage) return false;
            if (activeFilters.type && v.category !== activeFilters.type) return false;
            if (activeFilters.project && v.project !== activeFilters.project) return false;
            if (activeFilters.team && v.team !== activeFilters.team) return false;
            if (activeFilters.owner && v.owner !== activeFilters.owner) return false;

            return true;
        });

        renderInUseVehicles(filtered);
    }

    function renderInUseVehicles(vehicles) {
        const grid = document.getElementById('inUseVehicleGrid');
        if (!vehicles.length) {
            grid.innerHTML = '<div class="loading-spinner">No vehicles found matching criteria.</div>';
            return;
        }

        const header = `
            <div class="in-use-table-wrapper">
                <table class="in-use-table">
                    <thead>
                        <tr>
                            <th>Vehicle No.</th>
                            <th>Make / Model</th>
                            <th>Category</th>
                            <th>Usage</th>
                            <th>Project</th>
                            <th>Team</th>
                            <th>Beneficiary</th>
                            <th>Owner</th>
                            <th>In Use Days</th>
                            <th>Avg Rating</th>
                        </tr>
                    </thead>
                    <tbody>
        `;

        const rows = vehicles.map(v => {
            const starsCount = Math.round(v.stars || 0);
            const fullStars = '★'.repeat(Math.min(starsCount, 5));
            const emptyStars = '☆'.repeat(5 - Math.min(starsCount, 5));
            const avgRating = typeof v.stars === 'number' ? (Math.round(v.stars * 10) / 10).toFixed(1) : '0.0';
            const ratingHtml = `<span>${fullStars}</span><span class="dim">${emptyStars}</span> <span style="color:#374151;">(${avgRating})</span>`;

            const team = v.team || 'Unassigned';
            const bg = teamColorMap[team] || '#ffffff';
            const daysInUse = computeInUseDays(v);
            const daysLabel = daysInUse === null ? '-' : `${daysInUse}d`;

            return `
                <tr class="team-group-row" style="background:${bg};">
                    <td class="vc-vehicle-cell">${v.vehicleNumber || '-'}</td>
                    <td>${(v.make || '-') + ' ' + (v.model || '')}</td>
                    <td>${v.category || '-'}</td>
                    <td class="vc-usage-cell">${v.usageType || '-'}</td>
                    <td>${v.project || '-'}</td>
                    <td class="vc-team-cell">${team}</td>
                    <td>${v.beneficiary || '-'}</td>
                    <td class="vc-owner-cell">${v.owner || '-'}</td>
                    <td class="vc-days-cell">${daysLabel}</td>
                    <td class="vc-rating-cell" title="Avg Rating: ${avgRating}">${ratingHtml}</td>
                </tr>
            `;
        }).join('');

        const footer = `
                    </tbody>
                </table>
            </div>
        `;

        grid.innerHTML = header + rows + footer;
    }

    if (typeof document !== 'undefined') {
        document.addEventListener('visibilitychange', function () {
            const modal = document.getElementById('inUseVehicleModal');
            const isOpen = modal && modal.classList.contains('show');
            if (document.hidden) {
                stopInUseAutoRefresh();
            } else if (isOpen) {
                fetchInUseVehicles({ silent: true });
                startInUseAutoRefresh();
            }
        });
    }
</script>
